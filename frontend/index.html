<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edvora — Academic Intelligence Workspace</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#16171b",
              "surface-container-high": "#1a1b20",
              "surface-container-low": "#121316",
              "surface-container-lowest": "#0c0d10",
              "surface-bright": "#22242a",
              "background": "#121316",
              "on-surface": "#fafafa",
              "on-surface-variant": "#9ca3af",
              "primary": "#a78bfa",
              "primary-container": "#7c3aed",
              "primary-fixed-dim": "#c4b5fd",
              "on-primary": "#0a0012",
              "secondary-fixed": "#71717a",
              "outline-variant": "rgba(255, 255, 255, 0.08)",
              "outline": "rgba(255, 255, 255, 0.15)",
              "tertiary": "#34d399",
              "tertiary-container": "#065f46",
              "on-tertiary-container": "#bbf7d0",
              "surface-container-highest": "#1e1e22",
              "secondary": "#71717a"
            },
            fontFamily: {
              headline: ["Geist", "sans-serif"],
              body: ["Geist", "sans-serif"],
              mono: ["Geist Mono", "monospace"]
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-background text-on-surface antialiased min-h-screen selection:bg-primary/30 selection:text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
