services:
  db:
    image: postgres:15-alpine
    container_name: edvora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edvora
    ports:
      - "5432:5432"
    volumes:
      - edvora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edvora_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/edvora
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      UPLOAD_DIR: "/app/data/uploads"
      CHROMA_PERSIST_DIR: "/app/data/chroma_db"
      ENVIRONMENT: "production"
    ports:
      - "8000:8000"
    volumes:
      - edvora_uploads:/app/data/uploads
      - edvora_chroma:/app/data/chroma_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Client build requires public/routable backend URL reachable from the browser.
        # Defaults to http://localhost:8000 for local single-host Docker Compose deployment.
        # In remote deployments, export VITE_API_BASE_URL=http://<host-ip-or-domain>:8000
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: edvora_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  edvora_pgdata:
  edvora_uploads:
  edvora_chroma:

